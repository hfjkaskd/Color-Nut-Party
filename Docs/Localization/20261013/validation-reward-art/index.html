<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>现金奖励图片修复对比</title>
<style>body{font:16px/1.5 system-ui;background:#f4eee2;color:#493220;margin:0;padding:28px}main{max-width:1100px;margin:auto}h1{font-size:25px}select{font:inherit;padding:9px;margin-right:12px;border:1px solid #c9af89;border-radius:8px;background:#fffdf7}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;border-radius:12px}h2{font-size:18px}p{max-width:900px}a{color:#7d4c1e}@media(max-width:600px){body{padding:16px}section{gap:10px}h2{font-size:15px}}</style>
<main><h1>现金奖励图片已补回</h1><p>修复国家现金图片资源缺失，以及广告图标遮住领取文字的问题。以下均为 Unity 实际运行截图。8 种语言、2 种屏幕比例、6 类奖励画面，共 96 张截图检查通过；46 个国家的 184 项图片加载检查通过。</p><p>修复和专属桌面图标已收入 1.0.1 正式签名 APK；签名、版本和包内图标检查通过。本页为 Editor 画面验证，未进行真机复测。</p>
<p><select id="lang"><option value="ja">日语</option><option value="en">英语</option><option value="pt">葡萄牙语</option><option value="de">德语</option><option value="fr">法语</option><option value="id">印尼语</option><option value="ru">俄语</option><option value="es">西班牙语</option></select><select id="ratio"><option value="short">720 × 1280</option><option value="tall">720 × 1600</option></select><a href="report.json">完整检查报告</a></p>
<section><div><h2>修复前</h2><img id="before"></div><div><h2>修复后</h2><img id="after"></div></section>
<h2>同类弹窗复查</h2><p><select id="page"><option value="lucky">幸运奖励</option><option value="settlement-no-ad">无广告领取</option><option value="undo">撤回道具</option><option value="shuffle">打乱道具</option><option value="bolt">新增螺丝道具</option></select></p><img id="related" style="max-width:538px">
<script>const lang=document.getElementById('lang'),ratio=document.getElementById('ratio'),page=document.getElementById('page');function refresh(){const prefix=lang.value+'-'+ratio.value+'-';document.getElementById('before').src='../validation/'+prefix+'settlement.png';document.getElementById('after').src=prefix+'settlement.png';document.getElementById('related').src=prefix+page.value+'.png'}for(const el of [lang,ratio,page])el.addEventListener('change',refresh);refresh();</script></main></html>
